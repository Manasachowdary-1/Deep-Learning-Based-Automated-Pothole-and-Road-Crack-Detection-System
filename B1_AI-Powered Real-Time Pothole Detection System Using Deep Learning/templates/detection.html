<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pothole Detection</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: url('{{ url_for('static', filename='detect.gif') }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .box {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            padding: 40px 50px;
            border-radius: 18px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.5);
            text-align: center;
            animation: fadeIn 1.4s ease;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 25px;
            text-shadow: 0 3px 12px rgba(0,0,0,0.4);
        }

        .btn {
            display: block;
            width: 250px;
            margin: 15px auto;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            color: #000;
            background: linear-gradient(135deg, #33ffcc, #3399ff);
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            transition: 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #55ffee, #55aaff);
            box-shadow: 0 10px 28px rgba(0,0,0,0.45);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🕳️ Pothole Detection</h1>

        <button class="btn" onclick="location.href='/signin'">🔐 Sign In</button>
        <button class="btn" onclick="location.href='/signup'">📝 Sign Up</button>
        <button class="btn" onclick="location.href='/'">🏠 Return Home</button>
    </div>

</body>
</html>
