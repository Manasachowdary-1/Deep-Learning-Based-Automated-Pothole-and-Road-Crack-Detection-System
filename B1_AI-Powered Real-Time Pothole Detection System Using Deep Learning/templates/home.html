<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Pothole Detection in Video Streams Using AI-Driven Deep Learning Techniques</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: url('{{ url_for('static', filename='home.gif') }}');
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            backdrop-filter: blur(2px);
            color: #fff;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            backdrop-filter: blur(6px);
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(255, 255, 255, 0.2);
        }

        .btn-container {
            margin-top: 40px;
            display: flex;
            gap: 25px;
        }

        .custom-btn {
            padding: 18px 32px;
            font-size: 18px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            background: linear-gradient(135deg, #ffcc33, #ff6600);
            color: #000;
            font-weight: 600;
            transition: 0.3s ease;
            box-shadow: 0px 5px 18px rgba(0,0,0,0.3);
        }

        .custom-btn:hover {
            transform: scale(1.08);
            box-shadow: 0px 8px 25px rgba(0,0,0,0.5);
            background: linear-gradient(135deg, #ffee55, #ff8800);
        }

        .custom-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>🕳️ Real-Time Pothole Detection in Video Streams Using AI-Driven Deep Learning Techniques 🚗💡</h1>

    <div class="btn-container">
        <button class="custom-btn" onclick="window.location.href='/about'">About Pothole</button>
        <button class="custom-btn" onclick="window.location.href='/detection'">Pothole Detection</button>
    </div>

</body>
</html>
