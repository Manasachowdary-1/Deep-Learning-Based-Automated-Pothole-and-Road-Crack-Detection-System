<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pothole Streaming</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: url('{{ url_for('static', filename='stream.gif') }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
            color: #fff;
        }

        .container {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            padding: 35px 45px;
            border-radius: 18px;
            width: 70%;
            max-width: 900px;
            text-align: center;
            box-shadow: 0 6px 25px rgba(0,0,0,0.5);
            animation: fadeIn 1.4s ease;
        }

        h1 {
            font-size: 34px;
            text-shadow: 0px 4px 12px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 26px;
            font-size: 18px;
            margin: 12px 10px;
            border: none;
            cursor: pointer;
            border-radius: 12px;
            font-weight: 600;
            color: #000;
            background: linear-gradient(135deg, #33ffcc, #3399ff);
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            transition: 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #55ffee, #55aaff);
            box-shadow: 0 10px 28px rgba(0,0,0,0.45);
        }

        #video {
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 22px rgba(0,0,0,0.4);
            max-width: 100%;
            height: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📡 Live Pothole Detection Streaming</h1>

        <!-- Buttons -->
        <button class="btn" onclick="document.getElementById('video').src='/start_stream'">▶️ Start Streaming</button>
        <button class="btn" onclick="document.getElementById('video').src=''">⏹️ Stop Streaming</button>

        <br>

        <!-- Live Video Output -->
        <img id="video" width="650">

        <br><br>

        <!-- Navigation -->
        <button class="btn" onclick="location.href='/detection'">🔄 Detect Again</button>
        <button class="btn" onclick="location.href='/'">🏠 Return Home</button>
    </div>

</body>
</html>
